# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# Article content lives in src/cli/data/*.md, is generated into
# src/assets/articles/*.json, and is served at runtime from a public GCS
# bucket. Prerendering reads from that same bucket, so the upload has to
# happen *before* the build - otherwise a newly added article renders no
# prerendered page and the build still exits 0.
name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci

      - name: Generate article JSON and prerender routes
        run: npm run generate-articles && npm run generate-routes

      # Reuses the service account already used by the Firebase deploy step
      # below. Only this workflow (master) ever authenticates to GCP - the
      # pull request workflow deliberately does not, so a PR can never publish
      # to the production bucket.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARD_ESTIMATOR }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload articles to the public assets bucket
        run: npm run upload-articles

      - run: npm run build && npm run generate-sitemap

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARD_ESTIMATOR }}'
          channelId: live
          projectId: card-estimator
