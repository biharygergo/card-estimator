# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# This workflow deliberately does NOT authenticate to GCP or upload articles.
# Publishing to the shared public assets bucket happens only on merge to
# master, so an open pull request can never mutate live article content.
name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci

      - name: Generate article JSON and prerender routes
        run: npm run generate-articles && npm run generate-routes

      # Catches the common mistake of editing src/cli/data/*.md without
      # regenerating. Generation is deterministic (see the .sort() in
      # generate_metadata.ts), so any diff here means the committed artifacts
      # are stale rather than that the machine differs.
      - name: Check generated artifacts are up to date
        run: |
          # --porcelain rather than `git diff`, so a brand new article whose
          # JSON was never committed shows up as untracked instead of passing
          # silently.
          DRIFT="$(git status --porcelain -- src/assets/articles routes.txt)"
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            git diff -- src/assets/articles routes.txt || true
            echo "::error::Generated article files are out of date. Run 'npm run generate-articles && npm run generate-routes' and commit the result."
            exit 1
          fi

      - run: npm run build && npm run generate-sitemap

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARD_ESTIMATOR }}'
          projectId: card-estimator
